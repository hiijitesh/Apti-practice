name: Deploy to GitHub Pages

on:
  push:
    branches: ["dev", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Drop files the site does not use
        # Work-in-progress datasets (~88 MB) and local attempt history are not loaded by the app
        run: rm -f public/data/reasoning.json public/data/calendar_reasoning.json public/data/advanced_maths_questions.json public/data/attempts.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

